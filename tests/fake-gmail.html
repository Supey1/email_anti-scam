<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fake Gmail test page</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f6f8fc; }
    .bar { padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; }
    .bar button { margin: 4px; padding: 6px 10px; font-size: 14px; }
    .mail { margin: 16px; padding: 16px 20px; background: #fff; border-radius: 8px; max-width: 640px; }
    h2.hP { font-size: 22px; font-weight: normal; }
  </style>
</head>
<body>
  <!--
    Practice page that copies the parts of Gmail our extension reads
    (h2.hP = subject, span.gD = sender, div.a3s = message text).
    Open this file in Chrome to try the panel without touching real email.
    Extraction lives in extension/content/gmail-adapter.js (the selectors) and tests/browser/gmail-adapter.test.js checks it.
    The links are fake and use made-up addresses. Don't change them to real scam links.
  -->
  <div class="bar">
    <strong>Pick a test email:</strong>
    <span id="buttons"></span>
    <button id="close">Back to inbox (no email open)</button>
  </div>
  <div id="mail"></div>

  <script>
    const SAMPLES = [
      {
        label: 'Fake PayPal',
        name: 'PayPal Security', email: 'alerts@paypa1-secure.xyz',
        subject: 'Your account has been suspended',
        body: 'Dear customer, we noticed unusual activity on your account. Verify your account within 24 hours or it will be closed.',
        links: [['www.paypal.com', 'http://paypa1-secure.xyz/login']],
      },
      {
        label: 'Grandparent scam',
        name: 'Tommy', email: 'tommy83920@gmail.com',
        subject: 'Grandma please help',
        body: "Grandma, it's me. I was in an accident and need bail money. Please buy gift cards and don't tell mom.",
        links: [],
      },
      {
        label: 'Shipping (be careful)',
        name: 'Delivery Notice', email: 'notice@parcel-update.example',
        subject: 'Package on hold',
        body: 'Your package could not be delivered. Click below to reschedule.',
        links: [['Reschedule delivery', 'https://bit.ly/fake-test-link']],
      },
      {
        label: 'Fake bank (hidden link)',
        name: 'Chase Alerts', email: 'alerts@chase-verify.example',
        subject: 'Action needed on your account',
        body: 'Please sign in to review a recent charge.',
        links: [['www.chase.com/review', 'https://secure-review.example/login']],
      },
      {
        label: 'Delivery from UPS (real)',
        name: 'UPS', email: 'pkginfo@ups.com',
        subject: 'Delivery update',
        body: 'Your package could not be delivered. You can reschedule delivery online.',
        links: [['Reschedule', 'https://www.ups.com/track']],
      },
      {
        label: 'Doctor reminder',
        name: 'Valley Clinic', email: 'reminders@valleyclinic.example',
        subject: 'Appointment tomorrow',
        body: 'Please confirm your appointment for tomorrow at 10am. If you cannot come, call us immediately.',
        links: [],
      },
      {
        label: 'Lottery win',
        name: 'Prize Office', email: 'office@lucky-draw.example',
        subject: 'You have won!',
        body: 'You have won the lottery! To release your prize, send a gift card for the processing fee.',
        links: [],
      },
      {
        label: 'Shared invoice (hard)',
        name: 'Morgan Lee', email: 'morgan.lee@docs-share-portal.example',
        subject: 'Invoice 4471',
        body: 'Hi, please review the invoice I shared with you when you have a moment.',
        links: [['View invoice', 'https://docs-share-portal.example/inv/4471']],
      },
      {
        label: 'Normal email',
        name: 'Linda', email: 'linda.m@gmail.com',
        subject: 'Lunch Saturday?',
        body: 'Are you free for lunch on Saturday? The new diner opened on Main Street.',
        links: [],
      },
    ];

    function openSample(s) {
      const mail = document.getElementById('mail');
      mail.replaceChildren();
      const box = document.createElement('div');
      box.className = 'mail';
      const subject = document.createElement('h2');
      subject.className = 'hP';
      subject.textContent = s.subject;
      const sender = document.createElement('span');
      sender.className = 'gD';
      sender.setAttribute('name', s.name);
      sender.setAttribute('email', s.email);
      sender.textContent = `${s.name} <${s.email}>`;
      const body = document.createElement('div');
      body.className = 'a3s';
      const p = document.createElement('p');
      p.textContent = s.body;
      body.append(p);
      for (const [text, href] of s.links) {
        const a = document.createElement('a');
        a.textContent = text;
        a.href = href;
        a.addEventListener('click', e => e.preventDefault()); // never actually open test links
        body.append(a);
      }
      box.append(subject, sender, body);
      mail.append(box);
    }

    const buttons = document.getElementById('buttons');
    SAMPLES.forEach(s => {
      const b = document.createElement('button');
      b.textContent = s.label;
      b.onclick = () => openSample(s);
      buttons.append(b);
    });
    document.getElementById('close').onclick = () => document.getElementById('mail').replaceChildren();
  </script>

  <!-- The same files the extension loads into Gmail. The browser tests strip this block
       (between the "standalone" markers) because the real extension injects them itself. -->
  <!-- standalone:start -->
  <script src="../extension/threat-list.js"></script>
  <script src="../extension/core/url-normalizer.js"></script>
  <script src="../extension/core/domain-rules.js"></script>
  <script src="../extension/core/url-rules.js"></script>
  <script src="../extension/core/text-rules.js"></script>
  <script src="../extension/core/risk-policy.js"></script>
  <script src="../extension/core/explanations.js"></script>
  <script src="../extension/core/analyzer.js"></script>
  <script src="../extension/rules.js"></script>
  <script src="../extension/settings-sync.js"></script>
  <script src="../extension/speech.js"></script>
  <script src="../extension/panel-styles.js"></script>
  <script src="../extension/ui/explain.js"></script>
  <script src="../extension/ui/warning-view.js"></script>
  <script src="../extension/panel.js"></script>
  <script src="../extension/content/ad-signals.js"></script>
  <script src="../extension/content/gmail-adapter.js"></script>
  <script src="../extension/content/gmail.js"></script>
  <!-- standalone:end -->
</body>
</html>
