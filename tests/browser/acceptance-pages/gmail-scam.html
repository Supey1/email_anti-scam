<!doctype html>
<!-- A pretend Gmail page (the test serves it AS mail.google.com). Same parts gmail.js reads:
     h2.hP = subject, span.gD = sender, div.a3s = message. The scam is made up; links end in .example. -->
<html lang="en"><head><meta charset="utf-8"><title>Your package is on hold - Gmail</title></head>
<body>
  <h2 class="hP">Your package is on hold</h2>
  <span class="gD" name="USPS Delivery" email="notice@usps-redelivery.example">USPS Delivery</span>
  <div class="a3s">
    <p>Your package is on hold. Pay the $1.99 redelivery fee to release your package within 24 hours.</p>
    <a id="reschedule" href="https://usps-redelivery.example/track">Reschedule delivery</a>
  </div>
</body></html>
