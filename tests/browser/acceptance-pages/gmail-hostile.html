<!doctype html>
<!-- A pretend Gmail page whose sender name, subject, text, and link try to inject HTML into
     the extension's panel. The panel must show all of it as plain text. -->
<html lang="en"><head><meta charset="utf-8"><title>Hostile - Gmail</title></head>
<body>
  <h2 class="hP">&lt;img src=x onerror="window.__pwned=1"&gt; Your account is locked</h2>
  <span class="gD" name="&lt;img src=x onerror=&quot;window.__pwned=1&quot;&gt; PayPal" email="alerts@paypa1-secure.example">PayPal</span>
  <div class="a3s">
    <p>&lt;script&gt;window.__pwned=1&lt;/script&gt; Verify your account within 24 hours.</p>
    <a id="hostile-link" href="https://paypa1-secure.example/login">&lt;img src=x onerror="window.__pwned=1"&gt; www.paypal.com</a>
  </div>
</body></html>
