<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Frames practice</title></head>
<body style="font-family:Arial;max-width:680px;margin:30px auto">
  <!-- Test page: frames. All addresses are made-up ".example" names.
       The click guard runs inside frames too, so a click on a risky link inside an ad frame is stopped (and the warning
       opens for the whole tab), including frames made with srcdoc. -->
  <h1>Frames practice</h1>
  <iframe id="same-origin" class="ad-frame" src="ad-frame.html" width="420" height="110"></iframe>
  <iframe id="srcdoc" class="ad-frame" width="420" height="90"
    srcdoc='<p>You have won a gift card! Claim your reward now. Act now!</p><a id="frame-link" href="https://claim-gift.example/srcdoc">Claim reward</a>'></iframe>
  <iframe id="cross-origin" class="ad-frame" src="https://adframe.example/ad" width="420" height="90"></iframe>
</body></html>
