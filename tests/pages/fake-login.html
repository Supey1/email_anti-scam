<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PayPal - Log in</title></head>
<body style="font-family:Arial;max-width:420px;margin:40px auto">
  <h1>Log in</h1>
  <p>Verify your account within 24 hours or it will be locked.</p>
  <!-- Practice page only. The form target is a made-up ".example" address and is never contacted. -->
  <form action="https://collect-login.example/post" method="post" onsubmit="return false">
    <p><input name="email" placeholder="Email"></p>
    <p><input name="pw" type="password" placeholder="Password"></p>
    <button>Log in</button>
  </form>
  <p><a id="verify" href="https://paypa1-secure.example/verify">Verify your PayPal account now</a></p>
</body></html>
